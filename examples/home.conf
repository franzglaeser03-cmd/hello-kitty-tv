# The home screen settings from the final look. Push to the TV with:
#   adb push examples/home.conf /sdcard/Android/data/tv.dumbtv.home/files/home.conf
# clear glass suits the wallpapers from launcher/wallpapers.py; smoked suits a light picture.
accent=white
layout=shelf
tile_style=glass
logos=color
glass_tone=smoked
labels=focus
clock=24h
background=image
dim=0
rotate=off
inputs=on
switch=auto
# SmartTube, under the name and logo people look for.
name.org.smarttube.stable=YouTube
art.org.smarttube.stable=com.amazon.firetv.youtube
apps.order=dumbtv.livetv,com.amazon.firebat,com.netflix.ninja,org.smarttube.stable,dumbtv.cast,com.disney.disneyplus,com.hbo.hbonow,com.apple.atve.amazon.appletv,com.spotify.tv.android,com.zdf.android.mediathek,de.swr.ard.avp.mobile.android.amazon,tv.arte.plus7,com.amazon.venezia,dumbtv.wifi
apps.show=com.amazon.venezia,com.zdf.android.mediathek
apps.hide=com.apple.airplay.amazon.airplay,com.amazon.bueller.music,com.vewd.core.fvpplayer,com.vewd.core.tvapp,dnsfilter.android,com.amazon.firetv.youtube
